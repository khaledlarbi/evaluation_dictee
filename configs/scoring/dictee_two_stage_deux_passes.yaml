# ═══════════════════════════════════════════════════════════════════════════
#  Run scoring dictée — MÉTHODE B, transcription EN DEUX PASSES
# ═══════════════════════════════════════════════════════════════════════════
#  Variante de dictee_two_stage.yaml (prompt.transcription_verification: true) :
#    Passe 1 : le VLM ÉPELLE l'image à l'aveugle (sans référence), ligne par ligne,
#              + mots incertains ; le texte est recollé par le code.
#    Passe 2 : alignement, TEXTE SEUL (modèle model_stage2) : les mots lus, numérotés,
#              sont associés aux items de la dictée (ancres + Needleman-Wunsch). Le
#              modèle ne rend que des numéros ; le code valide (pas de croisement) et
#              ramène tout item incohérent à « absent » : un oubli ne décale plus la suite.
#    Codage : sur les paires (attendu, écrit) déjà alignées.
#  Le codage (étape 2) part de la transcription de la passe 2.
#  JSONL : transcription_passe1, n_incertains_passe1, n_absents_alignement,
#          n_mots_en_trop_alignement, n_reparations_alignement.
#  Bras d'expérience : export vers predictions/experimentations/ (D9).
# ───────────────────────────────────────────────────────────────────────────
#  Étape 1 : un VLM transcrit l'image (raw_transcription).
#  Étape 2 : un LLM texte code chaque item à partir de la transcription + grille.
#  Dérivé de dictee_REFERENCE.yaml : voir ce fichier pour la doc exhaustive de
#  chaque paramètre (les champs omis reprennent leur valeur par défaut).
#
#  Lancer : uv run scripts/run_benchmark.py --config configs/scoring/dictee_two_stage_deux_passes.yaml
#  Sortie  : data/processed/dictee_two_stage_deux_passes_<modele>_predictions.jsonl
#            (approach="two_stage" ; suffixe = modèle étape 1, + modèle étape 2 s'il diffère)
# ═══════════════════════════════════════════════════════════════════════════

name: dictee_two_stage_deux_passes
seed: 42
concurrency: 12

approach: two_stage

# Étape 1 = transcription (doit être multimodal pour lire l'image).
model:
  name: qwen3-6-35b-moe # gemma4-26b-moe
  kind: vlm
  temperature: 0.0
  # Passe 2 : une vérification détaillée par mot de référence (~83) → budget large.
  max_tokens: 16384
  request_logprobs: true
  max_retries: 2
  disable_thinking: true
  structured_output: true

# Étape 2 = codage textuel (modèle texte seul, obligatoire en two_stage).
model_stage2:
  name: qwen3-6-35b-moe # ou gemma4-26b-moe
  kind: llm
  temperature: 0.0
  max_tokens: 8192
  structured_output: true
  disable_thinking: true
  max_retries: 2

data:
  corpus: dictee
  images_path: s3://projet-production-ecrits-depp/dictee_2015/
  labels_path: s3://projet-production-ecrits-depp/resultat_dictee_2015.csv
  grid_path: configs/grille_dictee_2015.json
  limit: null

grid:
  scheme: simplifiee

prompt:
  method: B
  n_few_shot: 0
  enforce_faithful: true
  read_final_state: true
  chain_of_thought: false
  transcription_verification: true
